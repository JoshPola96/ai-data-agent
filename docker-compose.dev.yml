# Hot reload for development: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# Kept out of the default compose file because --reload restarts the process on every
# edit, and this backend spends ~45 seconds loading models into memory on each start.
services:
  backend:
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    environment:
      - STREAMLIT_SERVER_FILE_WATCHER_TYPE=poll
